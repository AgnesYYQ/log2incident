apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log2incident-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/log2incident.git'
    targetRevision: HEAD
    path: deploy/helm/log2incident
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: log2incident
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
